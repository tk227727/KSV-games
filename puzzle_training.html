<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>パズル練習盤</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
html,body{margin:0;min-height:100%;background:#0a0c12;color:#f5f7fb;overscroll-behavior:none}
body{min-height:100vh}
button,select{font:inherit}
.wrap{max-width:560px;margin:auto;padding:12px 10px 24px}
h1{font-size:22px;margin:2px 0 10px;text-align:center}
.panel{background:linear-gradient(180deg,#1c202a,#11141c);border:1px solid #343a48;border-radius:15px;padding:10px;margin-bottom:9px;box-shadow:0 5px 18px #0007}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
label{font-size:12px;color:#aeb6c6}
select,button{background:#292e3a;color:#fff;border:1px solid #485061;border-radius:10px;padding:8px 10px}
button{cursor:pointer}
button.primary{background:linear-gradient(#536eff,#3049d9);border-color:#7589ff;font-weight:700}
button.active{outline:2px solid #93a0ff}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.stat{background:#0d1017;border-radius:10px;padding:6px 2px;text-align:center}
.stat b{display:block;font-size:18px;line-height:1.2}
.stat small{color:#929aaa;font-size:10px}

#board{
  width:min(96vw,500px);
  margin:8px auto 7px;
  display:grid;
  gap:2px;
  padding:4px;
  border-radius:12px;
  background:linear-gradient(145deg,#4b5362,#171b23 55%,#303744);
  box-shadow:0 6px 22px #000b,inset 0 1px 1px #fff2;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  overscroll-behavior:none;
}
.cell{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  min-height:0;
  border-radius:7px;
  background:radial-gradient(circle at 50% 45%,#272c36,#11141a);
  overflow:hidden;
  touch-action:none
}
.dot{
  width:84%;
  height:84%;
  border-radius:50%;
  position:relative;
  box-shadow:inset 0 -4px 7px #0008,inset 0 2px 3px #fff8,0 2px 4px #000b;
  transition:transform .07s,opacity .07s
}
.dot:before{
  content:"";
  position:absolute;
  width:38%;
  height:24%;
  left:17%;
  top:12%;
  border-radius:50%;
  background:#fff9;
  filter:blur(2px);
  transform:rotate(-25deg)
}
.dot:after{content:"";display:none}
.c0 .dot{background:radial-gradient(circle at 35% 28%,#ff9a72,#e33e32 58%,#991b1b)}
.c1 .dot{background:radial-gradient(circle at 35% 28%,#8cd7ff,#3187e8 58%,#1450a2)}
.c2 .dot{background:radial-gradient(circle at 35% 28%,#b0f09b,#57b95e 58%,#28753b)}
.c3 .dot{background:radial-gradient(circle at 35% 28%,#fff39a,#e5b62e 58%,#9a6914)}
.c4 .dot{background:radial-gradient(circle at 35% 28%,#dba0ff,#9a58df 58%,#5a2b91)}
.c5 .dot{background:radial-gradient(circle at 35% 28%,#fff,#ff79ad 42%,#e53878 70%,#94153f)}
.cell.active .dot{opacity:.12}
.cell.clearing .dot{animation:orbClear .34s ease-out forwards}
@keyframes orbClear{
  0%{transform:scale(1);opacity:1}
  55%{transform:scale(1.22);opacity:.85}
  100%{transform:scale(.08);opacity:0}
}
.cell.dropping .dot{animation:orbDrop .15s ease-out}
@keyframes orbDrop{
  0%{transform:translateY(-125%);opacity:.25}
  100%{transform:translateY(0);opacity:1}
}
#dragOrb{
  position:fixed;
  left:0;top:0;
  z-index:9999;
  pointer-events:none;
  display:none;
  transform:translate(-50%,-50%);
  border-radius:50%;
  filter:brightness(1.12);
  box-shadow:inset 0 -5px 8px #0008,inset 0 2px 4px #fff9,0 5px 12px #000a;
}
#dragOrb:before{
  content:"";
  position:absolute;
  width:38%;
  height:24%;
  left:17%;top:12%;
  border-radius:50%;
  background:#fff9;
  filter:blur(2px);
  transform:rotate(-25deg)
}
#dragOrb:after{content:"";display:none}
#dragOrb.c0{background:radial-gradient(circle at 35% 28%,#ff9a72,#e33e32 58%,#991b1b)}
#dragOrb.c1{background:radial-gradient(circle at 35% 28%,#8cd7ff,#3187e8 58%,#1450a2)}
#dragOrb.c2{background:radial-gradient(circle at 35% 28%,#b0f09b,#57b95e 58%,#28753b)}
#dragOrb.c3{background:radial-gradient(circle at 35% 28%,#fff39a,#e5b62e 58%,#9a6914)}
#dragOrb.c4{background:radial-gradient(circle at 35% 28%,#dba0ff,#9a58df 58%,#5a2b91)}
#dragOrb.c5{background:radial-gradient(circle at 35% 28%,#fff,#ff79ad 42%,#e53878 70%,#94153f)}

#message{text-align:center;color:#cbd1dd;min-height:21px;font-size:13px;font-weight:600}
.customGrid{display:grid;gap:3px;width:min(96vw,500px);margin:9px auto}
.customCell{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;background:#171a22}
.customCell .dot{width:70%;height:70%}
.help{font-size:12px;color:#9099aa;line-height:1.5}
.hidden{display:none!important}
#palette button{min-width:42px;padding:7px}
body.dragging{overflow:hidden;touch-action:none}
@media(max-width:430px){
  .stats{grid-template-columns:repeat(5,1fr)}
  .stat b{font-size:16px}
  .stat small{font-size:9px}
}
@media(max-width:360px){
  .wrap{padding-left:6px;padding-right:6px}
  .stats{gap:3px}
}

/* ピンクドロップだけ四角形 */
.dot.c5,
#dragOrb.c5{
  border-radius:18% !important;
}


.time-custom{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.time-custom input[type="number"]{
  width:82px;background:#292e3a;color:#fff;border:1px solid #485061;
  border-radius:10px;padding:8px 10px;font:inherit
}
.unlimited-label{display:flex;align-items:center;gap:4px;white-space:nowrap}


/* ピンク（回復）は盤面上・操作中とも常に四角 */
.cell.c5 .dot,
.dot.c5,
#dragOrb.c5{
  border-radius:18% !important;
}

</style>
</head>
<body>
<div class="wrap">
<h1>🧩 パズル練習盤</h1>

<div class="panel">
  <div class="row">
    <label>盤面</label>
    <select id="size">
      <option value="6x5">6 × 5</option>
      <option value="7x6">7 × 6</option>
      <option value="5x4">5 × 4</option>
    </select>

    <label>操作時間</label>
    <div class="time-custom">
      <input id="timeInput" type="number" min="0.1" step="0.1" value="5" inputmode="decimal" aria-label="操作時間">
      <span>秒</span>
      <label class="unlimited-label"><input id="unlimitedTime" type="checkbox"> 無制限</label>
    </div>
  </div>

  <div class="row" style="margin-top:9px">
    <button class="primary" id="newBtn">新しい盤面</button>
    <button id="customBtn">盤面を自分で作る</button>
  </div>
</div>

<div class="panel">
  <div class="stats">
    <div class="stat"><b id="combo">0</b><small>コンボ</small></div>
    <div class="stat"><b id="timeLeft">5.0</b><small>残り</small></div>
    <div class="stat"><b id="elapsed">0.00</b><small>操作秒</small></div>
    <div class="stat"><b id="moves">0</b><small>移動数</small></div>
    <div class="stat"><b id="best">—</b><small>最高</small></div>
  </div>
</div>

<div id="playArea">
  <div id="board"></div>
  <div id="message">ドロップを押したまま動かしてください</div>
</div>

<div id="customArea" class="hidden">
  <div class="panel">
    <div class="help">色を選んでマスをタップすると盤面を作れます。</div>
    <div id="palette" class="row" style="margin-top:8px"></div>
    <div id="customGrid" class="customGrid"></div>
    <div class="row">
      <button class="primary" id="applyCustom">この盤面で練習</button>
      <button id="randomCustom">ランダムに埋める</button>
      <button id="clearCustom">全部消す</button>
    </div>
  </div>
</div>

<div class="panel help">
  パズルを動かしている間は画面スクロールを固定します。指を離すと、横・縦に3個以上そろったドロップが1コンボずつ順番に消えます。空いた場所には上からドロップが補充され、落下後に新しくそろったドロップも追加コンボとして続けて消えます。
</div>
</div>

<div id="dragOrb"></div>

<script>
const colors=6;
const marks=["火","水","木","光","闇","♥"];
let cols=6,rows=5,board=[];
let drag=null,rafTimer=null,limit=5,moves=0,busy=false;
let custom=false,customData=[],paintColor=0;
let best=Number(localStorage.getItem("puzzleBest")||0);
let frozenY=0;

const $=id=>document.getElementById(id);
$("best").textContent=best||"—";

function setSize(){
  const [c,r]=$("size").value.split("x").map(Number);
  cols=c;rows=r;
  $("board").style.gridTemplateColumns=`repeat(${cols},1fr)`;
  $("board").style.aspectRatio=`${cols}/${rows}`;
}
function randomBoard(){
  return Array.from({length:cols*rows},()=>Math.floor(Math.random()*colors));
}
function render(){
  const el=$("board");
  el.innerHTML="";
  board.forEach((v,i)=>{
    const cell=document.createElement("div");
    cell.className="cell c"+v;
    cell.dataset.i=i;
    const d=document.createElement("div");
    d.className="dot";
    d.dataset.mark=marks[v];
    cell.appendChild(d);
    el.appendChild(cell);
  });
}
function getOperationLimit(){
  if($("unlimitedTime").checked)return 0;
  const v=Number($("timeInput").value);
  return Number.isFinite(v)&&v>0?v:5;
}
function applyTimeSetting(){
  limit=getOperationLimit();
  $("timeInput").disabled=$("unlimitedTime").checked;
  if(!drag)$("timeLeft").textContent=limit?limit.toFixed(1):"∞";
}
function resetStats(){
  moves=0;
  $("moves").textContent="0";
  $("combo").textContent="0";
  $("elapsed").textContent="0.00";
  limit=getOperationLimit();
  $("timeLeft").textContent=limit?limit.toFixed(1):"∞";
}
function newBoard(message="ドロップを押したまま動かしてください"){
  cancelAnimationFrame(rafTimer);
  busy=false;
  drag=null;
  hideDragOrb();
  unlockPage();
  setSize();
  board=randomBoard();
  resetStats();
  render();
  $("message").textContent=message;
}

function indexFromPoint(x,y){
  const r=$("board").getBoundingClientRect();
  let c=Math.floor((x-r.left)/r.width*cols);
  let rr=Math.floor((y-r.top)/r.height*rows);
  c=Math.max(0,Math.min(cols-1,c));
  rr=Math.max(0,Math.min(rows-1,rr));
  return rr*cols+c;
}
function swap(a,b){
  if(a===b)return;
  [board[a],board[b]]=[board[b],board[a]];
  moves++;
  $("moves").textContent=moves;
  render();
}

/* 本家に近い「横/縦3個以上」の判定。
   まず直線マッチを印付けし、同色でつながった印付きセルを1コンボとして数える。 */
function getMatches(){
  const matched=new Set();

  for(let r=0;r<rows;r++){
    let start=0;
    for(let c=1;c<=cols;c++){
      const same=c<cols && board[r*cols+c]===board[r*cols+start];
      if(!same){
        if(c-start>=3) for(let x=start;x<c;x++) matched.add(r*cols+x);
        start=c;
      }
    }
  }
  for(let c=0;c<cols;c++){
    let start=0;
    for(let r=1;r<=rows;r++){
      const same=r<rows && board[r*cols+c]===board[start*cols+c];
      if(!same){
        if(r-start>=3) for(let y=start;y<r;y++) matched.add(y*cols+c);
        start=r;
      }
    }
  }

  const groups=[];
  const seen=new Set();
  for(const i of matched){
    if(seen.has(i))continue;
    const color=board[i],q=[i],group=[];
    seen.add(i);
    while(q.length){
      const x=q.pop();
      group.push(x);
      const rr=Math.floor(x/cols),cc=x%cols;
      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nr=rr+dr,nc=cc+dc,ni=nr*cols+nc;
        if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&matched.has(ni)&&!seen.has(ni)&&board[ni]===color){
          seen.add(ni);q.push(ni);
        }
      }
    }
    groups.push(group);
  }
  return {matched:[...matched],groups};
}

function lockPage(){
  if(document.body.classList.contains("dragging"))return;
  frozenY=window.scrollY;
  document.body.classList.add("dragging");
  document.body.style.position="fixed";
  document.body.style.top=`-${frozenY}px`;
  document.body.style.left="0";
  document.body.style.right="0";
}
function unlockPage(){
  if(!document.body.classList.contains("dragging"))return;
  document.body.classList.remove("dragging");
  document.body.style.position="";
  document.body.style.top="";
  document.body.style.left="";
  document.body.style.right="";
  window.scrollTo(0,frozenY);
}
function preventScroll(e){
  if(drag)e.preventDefault();
}
document.addEventListener("touchmove",preventScroll,{passive:false});

function showDragOrb(color,x,y){
  const orb=$("dragOrb");
  const cell=$("board").querySelector(".cell");
  const size=cell?cell.getBoundingClientRect().width*.86:48;
  orb.className="c"+color;
  orb.dataset.mark=marks[color];
  orb.style.width=size+"px";
  orb.style.height=size+"px";
  orb.style.fontSize=Math.max(13,size*.32)+"px";
  orb.style.display="block";
  moveDragOrb(x,y);
}
function moveDragOrb(x,y){
  const orb=$("dragOrb");
  orb.style.left=x+"px";
  orb.style.top=y+"px";
}
function hideDragOrb(){
  $("dragOrb").style.display="none";
}
function markActive(i){
  [...$("board").children].forEach(c=>c.classList.remove("active"));
  $("board").children[i]?.classList.add("active");
}

function startClock(){
  drag.started=performance.now();
  const tick=()=>{
    if(!drag)return;
    const elapsed=(performance.now()-drag.started)/1000;
    $("elapsed").textContent=elapsed.toFixed(2);
    if(limit){
      const left=Math.max(0,limit-elapsed);
      $("timeLeft").textContent=left.toFixed(1);
      if(left<=0){
        finishDrag(true);
        return;
      }
    }else{
      $("timeLeft").textContent="∞";
    }
    rafTimer=requestAnimationFrame(tick);
  };
  rafTimer=requestAnimationFrame(tick);
}

async function finishDrag(timeUp=false){
  if(!drag||busy)return;
  busy=true;
  cancelAnimationFrame(rafTimer);

  const finalElapsed=drag.started===null?0:(performance.now()-drag.started)/1000;
  $("elapsed").textContent=finalElapsed.toFixed(2);
  if(limit)$("timeLeft").textContent=Math.max(0,limit-finalElapsed).toFixed(1);

  drag=null;
  hideDragOrb();
  [...$("board").children].forEach(c=>c.classList.remove("active"));

  let totalCombo=0;
  let hadMatch=false;

  // 消去 → 落下・補充 → 再判定を、揃わなくなるまで繰り返す
  while(true){
    const result=getMatches();
    if(!result.groups.length)break;
    hadMatch=true;

    // 同時に成立している複数コンボも、1コンボずつ順番に表示・消去
    for(const group of result.groups){
      totalCombo++;
      $("combo").textContent=String(totalCombo);
      $("message").textContent=timeUp
        ? `時間切れ！ ${totalCombo}コンボ`
        : `${totalCombo}コンボ！`;

      group.forEach(i=>{
        $("board").children[i]?.classList.add("clearing");
      });

      await wait(170);

      // このコンボ分だけ空きマスにする
      group.forEach(i=>{
        board[i]=-1;
        const cell=$("board").children[i];
        if(cell) cell.innerHTML="";
      });

      await wait(70);
    }

    // 消えた場所へ既存ドロップを落とし、上から新しいドロップを補充
    collapseAndFill();
    render();
    [...$("board").children].forEach(c=>c.classList.add("dropping"));
    $("message").textContent=`${totalCombo}コンボ　落下中…`;
    await wait(160);

    // 落下後に新しく揃ったものも次のコンボとして続けて判定
    await wait(50);
  }

  if(totalCombo>best){
    best=totalCombo;
    localStorage.setItem("puzzleBest",best);
    $("best").textContent=best;
  }

  if(!hadMatch){
    $("combo").textContent="0";
    $("message").textContent=timeUp?"時間切れ！ マッチなし":"マッチなし";
    await wait(350);
  }else{
    $("message").textContent=`${totalCombo}コンボ！　終了`;
    await wait(220);
  }

  // 盤面はそのまま残す。次の練習は「新しい盤面」で開始。
  $("timeLeft").textContent=limit?limit.toFixed(1):"∞";
  busy=false;
  unlockPage();
}

function collapseAndFill(){
  for(let c=0;c<cols;c++){
    const kept=[];

    // 下から順に、消えていないドロップを保持
    for(let r=rows-1;r>=0;r--){
      const v=board[r*cols+c];
      if(v>=0)kept.push(v);
    }

    // 足りない分は上から降ってくる新規ランダムドロップ
    while(kept.length<rows){
      kept.push(Math.floor(Math.random()*colors));
    }

    // 下側から詰め直す
    for(let r=rows-1;r>=0;r--){
      board[r*cols+c]=kept[rows-1-r];
    }
  }
}

function wait(ms){return new Promise(r=>setTimeout(r,ms))}

$("board").addEventListener("pointerdown",e=>{
  if(busy||drag||!e.target.closest(".cell"))return;
  e.preventDefault();

  const i=indexFromPoint(e.clientX,e.clientY);
  const color=board[i];

  limit=getOperationLimit();
  drag={last:i,color,pointerId:e.pointerId,started:null};

  lockPage();
  try{$("board").setPointerCapture(e.pointerId)}catch(_){}
  showDragOrb(color,e.clientX,e.clientY);
  markActive(i);
  $("message").textContent="操作中…";
  startClock();
});

$("board").addEventListener("pointermove",e=>{
  if(!drag||busy)return;
  e.preventDefault();
  moveDragOrb(e.clientX,e.clientY);

  const target=indexFromPoint(e.clientX,e.clientY);
  if(target===drag.last)return;

  // 最初に1マス動いた瞬間から操作時間を計測開始
  if(drag.started===null){
    drag.started=performance.now();
    startTimer();
  }

  // 現在位置から指の位置まで、縦横＋斜めの8方向で1マスずつ移動
  let cur=drag.last;
  let guard=0;
  while(cur!==target && guard++<Math.max(rows,cols)*2){
    const cr=Math.floor(cur/cols), cc=cur%cols;
    const tr=Math.floor(target/cols), tc=target%cols;
    const nr=cr+Math.sign(tr-cr);
    const nc=cc+Math.sign(tc-cc);
    const next=nr*cols+nc;
    swap(cur,next);
    cur=next;
  }
  drag.last=cur;
  markActive(cur);
});

$("board").addEventListener("pointerup",e=>{
  if(!drag)return;
  e.preventDefault();
  finishDrag(false);
});
$("board").addEventListener("pointercancel",e=>{
  if(drag)finishDrag(false);
});

$("newBtn").onclick=()=>newBoard();
$("size").onchange=()=>{
  if(custom)initCustom();
  else newBoard("盤面サイズを変更しました");
};
$("timeInput").oninput=applyTimeSetting;
$("unlimitedTime").onchange=applyTimeSetting;

function initCustom(){
  cancelAnimationFrame(rafTimer);
  drag=null;busy=false;unlockPage();hideDragOrb();
  custom=true;
  $("playArea").classList.add("hidden");
  $("customArea").classList.remove("hidden");
  const [c,r]=$("size").value.split("x").map(Number);
  cols=c;rows=r;
  customData=randomBoard();
  renderCustom();
  makePalette();
}
function renderCustom(){
  const g=$("customGrid");
  g.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  g.innerHTML="";
  customData.forEach((v,i)=>{
    const cell=document.createElement("div");
    cell.className="customCell "+(v>=0?"c"+v:"");
    if(v>=0){
      const d=document.createElement("div");
      d.className="dot";
      d.dataset.mark=marks[v];
      cell.appendChild(d);
    }
    cell.onclick=()=>{
      customData[i]=(customData[i]===paintColor?-1:paintColor);
      renderCustom();
    };
    g.appendChild(cell);
  });
}
function makePalette(){
  const p=$("palette");
  p.innerHTML="";
  for(let c=0;c<colors;c++){
    const b=document.createElement("button");
    b.textContent=marks[c];
    if(c===paintColor)b.classList.add("active");
    b.onclick=()=>{paintColor=c;makePalette()};
    p.appendChild(b);
  }
}
$("customBtn").onclick=initCustom;
$("randomCustom").onclick=()=>{customData=randomBoard();renderCustom()};
$("clearCustom").onclick=()=>{customData=Array(cols*rows).fill(-1);renderCustom()};
$("applyCustom").onclick=()=>{
  if(customData.some(v=>v<0)){
    alert("空いているマスがあります。すべて埋めてください。");
    return;
  }
  custom=false;
  board=[...customData];
  $("customArea").classList.add("hidden");
  $("playArea").classList.remove("hidden");
  setSize();
  resetStats();
  render();
  $("message").textContent="自作盤面スタート！";
};

setSize();
board=randomBoard();
