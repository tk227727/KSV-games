<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パズドラ ドロップ率計算</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101522;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:700px;margin:auto;padding:18px 14px 40px}h1{font-size:25px}.sub,.note{color:#aeb8ca;font-size:13px;line-height:1.6}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{border:0;border-radius:12px;padding:12px;font-weight:800;background:#252c3b;color:#c9d2e2}.tab.active{background:#eef2f8;color:#111827}.card{background:#1a2130;border:1px solid #30394b;border-radius:16px;padding:15px;margin:10px 0}.row{display:grid;grid-template-columns:1fr 118px;gap:10px;align-items:center;margin:12px 0}input{width:100%;background:#101622;color:white;border:1px solid #465168;border-radius:10px;padding:10px;font-size:16px;text-align:right}.result{text-align:center;padding:22px}.big{font-size:42px;font-weight:900;margin:5px}.ok{color:#9fe8b0}.badge{display:inline-block;background:#293246;border-radius:999px;padding:6px 10px;font-size:12px}.formula{font-size:12px;color:#9eabc0;margin-top:12px}.hidden{display:none}</style></head><body><div class="wrap">
<h1>ドロップ率計算</h1><p class="sub">通常ドロップと部位破壊素材を切り替えて計算できます。</p>
<div class="tabs"><button class="tab active" id="nt">通常ドロップ</button><button class="tab" id="pt">部位破壊</button></div>
<section id="normal"><div class="card"><div class="row"><label>基礎ドロップ率（%）</label><input id="nb" type="number" value="10" min="0" step=".1"></div><div class="row"><label>リーダー倍率</label><input id="nl" type="number" value="1" min="0" step=".01"></div><div class="row"><label>フレンド倍率</label><input id="nf" type="number" value="1" min="0" step=".01"></div><div class="row"><label>ダンジョンボーナス（個）</label><input id="nd" type="number" value="0" min="0" step="1"></div></div><div class="card result"><small>最終ドロップ率</small><div class="big" id="nr"></div><div class="badge" id="ns"></div><div class="formula" id="nform"></div></div></section>
<section id="part" class="hidden"><div class="card"><div class="row"><label>素材の基礎ドロップ率（%）</label><input id="pb" type="number" value="10" min="0" step=".1"></div><div class="row"><label>部位破壊ボーナス（個）</label><input id="pd" type="number" value="0" min="0" step="1"></div><div class="row"><label>部位破壊LS・リーダー倍率</label><input id="pl" type="number" value="1" min="0" step=".01"></div><div class="row"><label>部位破壊LS・フレンド倍率</label><input id="pf" type="number" value="1" min="0" step=".01"></div></div><div class="card result"><small>部位破壊素材の最終ドロップ率</small><div class="big" id="pr"></div><div class="badge" id="ps"></div><div class="formula" id="pform"></div></div><div class="card note">部位破壊ボーナスは1個につき10%加算。部位破壊素材には通常のドロップ率アップやダンジョンボーナスではなく、専用の部位破壊ドロップ率リーダースキルを設定します。</div></section>
</div><script>
const $=x=>document.getElementById(x),v=x=>Math.max(0,Number($(x).value)||0);
function nc(){let b=v("nb"),l=v("nl"),f=v("nf"),d=Math.floor(v("nd")),raw=b*l*f+(2*d),r=Math.min(100,raw);$("nr").textContent=r.toFixed(1)+"%";$("nr").className="big"+(raw>=100?" ok":"");$("ns").textContent=raw>=100?"確定ドロップ":"確定まで "+(100-r).toFixed(1)+"%";$("nform").textContent=`(${b}% × ${l} × ${f}) + (2% × ${d}) = ${raw.toFixed(2)}%`}
function pc(){let b=v("pb"),d=Math.floor(v("pd")),l=v("pl"),f=v("pf"),raw=(b+d*10)*l*f,r=Math.min(100,raw);$("pr").textContent=r.toFixed(1)+"%";$("pr").className="big"+(raw>=100?" ok":"");let n=0;while((b+(d+n)*10)*l*f<100&&n<1000)n++;$("ps").textContent=raw>=100?"確定ドロップ":`確定まで部位破壊ボーナス あと${n}個`;$("pform").textContent=`(${b}% + ${d} × 10%) × ${l} × ${f} = ${raw.toFixed(2)}%`}
function show(n){$("normal").classList.toggle("hidden",!n);$("part").classList.toggle("hidden",n);$("nt").classList.toggle("active",n);$("pt").classList.toggle("active",!n)}$("nt").onclick=()=>show(true);$("pt").onclick=()=>show(false);document.querySelectorAll("input").forEach(e=>e.oninput=()=>{nc();pc()});nc();pc();
</script></body></html>
